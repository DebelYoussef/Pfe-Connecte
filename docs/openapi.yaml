        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as nextCursor by the previous page
      schema: {type: string}
    OfferIdPath:
      name: id
      in: path
      required: true
      description: Offer id (offerId)
      schema: {type: string, format: uuid}
    ConventionIdPath:
      name: id
      in: path
      required: true
      description: Convention id (conventionId)
      schema: {type: string, format: uuid}
    StudentIdPath:
      name: studentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionPath:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}

  responses:
    BadRequest:
      description: Invalid input, unknown field, or missing reason/comment (400)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error: {code: VALIDATION_ERROR, message: Invalid input, details: {fields: [title]}, requestId: 6f1c2e0a-0000-4000-8000-000000000000}
    Unauthorized:
      description: Missing, invalid or expired token (401)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Insufficient role or scope, or wrong signature step (403)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource does not exist or is outside the caller's scope (404)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State or concurrency conflict (409)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Rate limit exceeded (429)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    # ------------------------------------------------------------ errors
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            requestId: {type: string}

    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
        timestamp: {type: string, format: date-time}

    # -------------------------------------------------------------- enums
    Role:
      type: string
      enum: [ETU, ENT, ENS, RESP, ADM]
    PublicRole:
      type: string
      description: Roles allowed at signup
      enum: [ETU, ENT, ENS]
    OfferStatus:
      type: string
      enum: [OPEN, CLOSED, FILLED]
    ApplicationStatus:
      type: string
      enum: [PENDING, VIEWED, IN_PROGRESS, ACCEPTED, REJECTED, CONFIRMED, DECLINED, WITHDRAWN]
    ApplicationAction:
      type: string
      enum: [in_progress, accept, reject, confirm, decline, withdraw]
    ConventionState:
      type: string
      enum: [DRAFT, SUBMITTED, SIGNED_STUDENT, SIGNED_COMPANY, APPROVED]
    ConventionEventType:
      type: string
      enum: [SUBMITTED, SIGNED, REJECTED, RESUBMITTED, APPROVED]
    SupervisionStatus:
      type: string
      enum: [REQUESTED, ACCEPTED, DECLINED, ASSIGNED]
    SupervisionDecision:
      type: string
      enum: [ACCEPTED, DECLINED]
    ReportStatus:
      type: string
      enum: [UNDER_REVIEW, CHANGES_REQUESTED, VALIDATED]
    ReportDecision:
      type: string
      enum: [APPROVED, CHANGES_REQUESTED]

    # --------------------------------------------------------------- auth
    User:
      type: object
      required: [userId, email, role, createdAt]
      properties:
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        etab: {type: string, description: Institution id (absent for companies)}
        firstName: {type: string}
        lastName: {type: string}
        department: {type: string}
        specialty: {type: string}
        skills: {type: array, items: {type: string}}
        gouvernorat: {type: string}
        cvKey: {type: string}
        expertise: {type: array, items: {type: string}}
        companyName: {type: string}
        activeCount: {type: integer, minimum: 0, maximum: 5}
        conventionId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: {type: string, description: 'JWT HS256, 60 minutes'}
        user: {$ref: '#/components/schemas/User'}
    SignupRequest:
      oneOf:
        - $ref: '#/components/schemas/SignupStudent'
        - $ref: '#/components/schemas/SignupCompany'
        - $ref: '#/components/schemas/SignupTeacher'
      discriminator:
        propertyName: role
        mapping:
          ETU: '#/components/schemas/SignupStudent'
          ENT: '#/components/schemas/SignupCompany'
          ENS: '#/components/schemas/SignupTeacher'
    SignupStudent:
      type: object
      additionalProperties: false
      required: [email, password, role, firstName, lastName, etab, department, specialty, gouvernorat]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
        role: {type: string, enum: [ETU]}
        firstName: {type: string}
        lastName: {type: string}
        etab: {type: string}
        department: {type: string}
        specialty: {type: string}
        skills: {type: array, items: {type: string}}
        gouvernorat: {type: string}
    SignupCompany:
      type: object
      additionalProperties: false
      required: [email, password, role, firstName, lastName, companyName]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
        role: {type: string, enum: [ENT]}
        firstName: {type: string}
        lastName: {type: string}
        companyName: {type: string}
    SignupTeacher:
      type: object
      additionalProperties: false
      required: [email, password, role, firstName, lastName, etab]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
        role: {type: string, enum: [ENS]}
        firstName: {type: string}
        lastName: {type: string}
        etab: {type: string}
        expertise: {type: array, items: {type: string}}
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        firstName: {type: string}
        lastName: {type: string}
        department: {type: string}
        specialty: {type: string}
        skills: {type: array, items: {type: string}}
        gouvernorat: {type: string}
        companyName: {type: string}
    ExpertiseUpdate:
      type: object
      additionalProperties: false
      required: [expertise]
      properties:
        expertise: {type: array, items: {type: string}}
    PresignedPost:
      type: object
      required: [url, fields, key, expiresIn]
      properties:
        url: {type: string, format: uri}
        fields: {type: object, additionalProperties: {type: string}}
        key: {type: string, description: S3 key the file will be stored under}
        expiresIn: {type: integer, example: 300}
    PdfUrl:
      type: object
      required: [url, expiresIn]
      properties:
        url: {type: string, format: uri}
        expiresIn: {type: integer, example: 300}

    # ------------------------------------------------------------- offers
    Offer:
      type: object
      required: [offerId, companyId, title, description, status, createdAt]
      properties:
        offerId: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        keywords: {type: array, items: {type: string}}
        skills: {type: array, items: {type: string}}
        gouvernorat: {type: string}
        durationWeeks: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/OfferStatus'}
        similar:
          type: array
          description: Similar archived subjects detected at publication (warning only)
          items: {$ref: '#/components/schemas/SimilarSubject'}
        createdAt: {type: string, format: date-time}
    SimilarSubject:
      type: object
      required: [subjectId, score]
      properties:
        subjectId: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
    OfferCreate:
      type: object
      additionalProperties: false
      required: [title, description, keywords, skills, gouvernorat, durationWeeks]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 5000}
        keywords: {type: array, items: {type: string}}
        skills: {type: array, items: {type: string}}
        gouvernorat: {type: string}
        durationWeeks: {type: integer, minimum: 1}
    OfferUpdate:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 5000}
        keywords: {type: array, items: {type: string}}
        skills: {type: array, items: {type: string}}
        gouvernorat: {type: string}
        durationWeeks: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/OfferStatus'}
    Recommendation:
      type: object
      required: [rank, offerId, score]
      properties:
        rank: {type: integer, minimum: 1, maximum: 5}
        offerId: {type: string, format: uuid}
        score: {type: number, minimum: 0, maximum: 100}
        computedAt: {type: string, format: date-time}
        offer: {$ref: '#/components/schemas/Offer'}

    # ------------------------------------------------------- applications
    Application:
      type: object
      required: [studentId, offerId, status, createdAt]
      properties:
        studentId: {type: string, format: uuid}
        offerId: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ApplicationStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        viewedAt: {type: string, format: date-time}
    ApplicationActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {$ref: '#/components/schemas/ApplicationAction'}

    # -------------------------------------------------------- conventions
    Convention:
      type: object
      required: [conventionId, studentId, companyId, offerId, etab, state, createdAt]
      properties:
        conventionId: {type: string, format: uuid}
        studentId: {type: string, format: uuid}
        companyId: {type: string, format: uuid}
        offerId: {type: string, format: uuid}
        etab: {type: string}
        state: {$ref: '#/components/schemas/ConventionState'}
        renderedText: {type: string}
        templateVersion: {type: integer}
        pdfSha256: {type: string}
        finalSha256: {type: string}
        shortRef: {type: string}
        currentActorId: {type: string, description: 'Student or company id, or RESP#{etab}; absent once APPROVED'}
        stepSince: {type: string, format: date-time}
        rejectionReason: {type: string}
        approvedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    ConventionEvent:
      type: object
      required: [conventionId, timestamp, type, actorId, actorRole]
      properties:
        conventionId: {type: string, format: uuid}
        timestamp: {type: string, format: date-time}
        type: {$ref: '#/components/schemas/ConventionEventType'}
        actorId: {type: string}
        actorRole: {$ref: '#/components/schemas/Role'}
        fromState: {$ref: '#/components/schemas/ConventionState'}
        toState: {$ref: '#/components/schemas/ConventionState'}
        pdfSha256: {type: string}
        reason: {type: string}
    ConventionDetail:
      allOf:
        - $ref: '#/components/schemas/Convention'
        - type: object
          properties:
            events:
              type: array
              items: {$ref: '#/components/schemas/ConventionEvent'}
    ConventionCorrection:
      type: object
      additionalProperties: false
      required: [renderedText]
      properties:
        renderedText: {type: string, minLength: 1}
    RejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    ConventionTemplate:
      type: object
      required: [version, text]
      properties:
        etab: {type: string}
        version: {type: integer, minimum: 1}
        text: {type: string, description: 'Text with {{placeholders}}'}
        createdAt: {type: string, format: date-time}
    ConventionTemplateInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1}
    DeadlineSettings:
      type: object
      additionalProperties: false
      required: [deadlineEnabled]
      properties:
        deadline: {type: string, format: date, nullable: true}
        deadlineEnabled: {type: boolean}

    # -------------------------------------------------------- supervision
    TeacherSummary:
      type: object
      required: [userId, firstName, lastName]
      properties:
        userId: {type: string, format: uuid}
        firstName: {type: string}
        lastName: {type: string}
        etab: {type: string}
        expertise: {type: array, items: {type: string}}
    Supervision:
      type: object
      required: [studentId, teacherId, status]
      properties:
        studentId: {type: string, format: uuid}
        teacherId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/SupervisionStatus'}
        etab: {type: string}
        requestedAt: {type: string, format: date-time}
        respondedAt: {type: string, format: date-time}
        assignedBy: {type: string, format: uuid}
    SupervisionRequest:
      type: object
      additionalProperties: false
      required: [teacherId]
      properties:
        teacherId: {type: string, format: uuid}
    SupervisionRespondRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {$ref: '#/components/schemas/SupervisionDecision'}
    SupervisionAssignRequest:
      type: object
      additionalProperties: false
      required: [teacherId]
      properties:
        teacherId: {type: string, format: uuid}

    # ------------------------------------------------------------ journals
    JournalEntry:
      type: object
      required: [studentId, week, content, submittedAt, validated]
      properties:
        studentId: {type: string, format: uuid}
        week: {type: string, example: 2026-W42}
        content: {type: string}
        submittedAt: {type: string, format: date-time}
        validated: {type: boolean}
        validatedBy: {type: string}
        validatedAt: {type: string, format: date-time}
        comment: {type: string}
    JournalEntryInput:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 5000}
    JournalValidateRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string, maxLength: 1000}

    # ------------------------------------------------------------- reports
    Report:
      type: object
      required: [studentId, version, status, submittedAt]
      properties:
        studentId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        sha256: {type: string}
        status: {$ref: '#/components/schemas/ReportStatus'}
        companyId: {type: string, format: uuid}
        teacherId: {type: string, format: uuid}
        companyDecision: {$ref: '#/components/schemas/ReportDecision'}
        teacherDecision: {$ref: '#/components/schemas/ReportDecision'}
        companyComment: {type: string}
        teacherComment: {type: string}
        submittedAt: {type: string, format: date-time}
    ReportReviewRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {$ref: '#/components/schemas/ReportDecision'}
        comment: {type: string, maxLength: 2000, description: Mandatory when decision is CHANGES_REQUESTED}

    # ------------------------------------------------------ notifications
    Notification:
      type: object
      required: [id, createdAt, type, title, read]
      properties:
        id: {type: string, description: 'Sort key createdAt#id; URL-encode in paths'}
        createdAt: {type: string, format: date-time}
        type: {type: string}
        title: {type: string}
        body: {type: string}
        refType: {type: string, example: CONVENTION}
        refId: {type: string}
        read: {type: boolean}

    # -------------------------------------------------------------- verify
    VerifyResult:
      type: object
      required: [verified, message]
      properties:
        verified: {type: boolean}
        message: {type: string, example: Convention vérifiée et validée}
        shortRef: {type: string}
        approvedAt: {type: string, format: date-time}
        etab: {type: string, description: Institution name}

    # --------------------------------------------------------------- admin
    AdminUserCreate:
      type: object
      additionalProperties: false
      required: [email, password, role]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
        role: {$ref: '#/components/schemas/Role'}
        etab: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        department: {type: string}
        specialty: {type: string}
        skills: {type: array, items: {type: string}}
        gouvernorat: {type: string}
        expertise: {type: array, items: {type: string}}
        companyName: {type: string}
    AdminUserUpdate:
      type: object
      additionalProperties: false
      properties:
        role: {$ref: '#/components/schemas/Role'}
        etab: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        department: {type: string}
        specialty: {type: string}
        gouvernorat: {type: string}
        companyName: {type: string}
    Institution:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    InstitutionInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
    Department:
      type: object
      required: [id, etab, name]
      properties:
        id: {type: string, description: '{etabId}#{deptId}'}
        etab: {type: string}
        name: {type: string}
    DepartmentInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        etab: {type: string, description: Required on creation}
        name: {type: string, minLength: 1}
    Specialty:
      type: object
      required: [id, department, name]
      properties:
        id: {type: string, description: '{deptId}#{specialtyId}'}
        department: {type: string}
        name: {type: string}
        compatibleWith: {type: array, items: {type: string}}
    SpecialtyInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        department: {type: string, description: Required on creation}
        name: {type: string, minLength: 1}
        compatibleWith: {type: array, items: {type: string}}

    # --------------------------------------------------------------- pages
    OfferPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Offer'}}
        nextCursor: {type: string, nullable: true}
    RecommendationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Recommendation'}}
        nextCursor: {type: string, nullable: true}
    ApplicationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Application'}}
        nextCursor: {type: string, nullable: true}
    ConventionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Convention'}}
        nextCursor: {type: string, nullable: true}
    TeacherPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TeacherSummary'}}
        nextCursor: {type: string, nullable: true}
    SupervisionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Supervision'}}
        nextCursor: {type: string, nullable: true}
    JournalPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/JournalEntry'}}
        nextCursor: {type: string, nullable: true}
    ReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Report'}}
        nextCursor: {type: string, nullable: true}
    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        nextCursor: {type: string, nullable: true}
    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
        nextCursor: {type: string, nullable: true}
    InstitutionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Institution'}}
        nextCursor: {type: string, nullable: true}
    DepartmentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Department'}}
        nextCursor: {type: string, nullable: true}
    SpecialtyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Specialty'}}
        nextCursor: {type: string, nullable: true}