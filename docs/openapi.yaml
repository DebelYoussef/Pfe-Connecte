openapi: 3.0.3
info:
  title: PFE Connect API
  version: 1.0.0
  description: >-
    REST API of PFE Connect (university internship and final-year project management).
    Serverless on AWS (API Gateway + Lambda + DynamoDB + S3), region us-east-1.
    Contract frozen with schema.md (contract-v1). Roles are enforced server-side in the Lambdas.
servers:
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com
    description: API Gateway (paths already include the /v1 prefix)
    variables:
      apiId:
        default: example
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Offers
  - name: Applications
  - name: Conventions
  - name: Supervision
  - name: Journals
  - name: Reports
  - name: Notifications
  - name: Verify
  - name: Admin
  - name: Health

paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      x-lambda: health
      x-roles: public
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}

  # ---------------------------------------------------------------- Auth
  /v1/auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Create an account (ETU, ENT or ENS only)
      description: RESP and ADM accounts are created by an administrator or by the seed script.
      x-lambda: auth
      x-roles: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignupRequest'}
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: Email already used (code EMAIL_TAKEN)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error: {code: EMAIL_TAKEN, message: Email already registered, details: {}, requestId: 6f1c2e0a-0000-4000-8000-000000000000}

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and obtain a JWT (HS256, 60 minutes)
      x-lambda: auth
      x-roles: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the caller's profile
      x-lambda: auth
      x-roles: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      tags: [Auth]
      operationId: updateMe
      summary: Update the caller's profile
      description: Student fields (department, specialty, skills, gouvernorat) or company fields (companyName). Triggers recommendation recomputation for students.
      x-lambda: auth
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdate'}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/me/cv-upload-url:
    post:
      tags: [Auth]
      operationId: createCvUploadUrl
      summary: Get a presigned S3 POST to upload the student's CV
      x-lambda: auth
      x-roles: [ETU]
      responses:
        '200':
          description: Presigned upload (5 minutes, content type and size enforced by the policy)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresignedPost'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/teachers/me/expertise:
    put:
      tags: [Auth]
      operationId: updateTeacherExpertise
      summary: Declare the teacher's areas of expertise
      x-lambda: auth
      x-roles: [ENS]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpertiseUpdate'}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  # -------------------------------------------------------------- Offers
  /v1/offers:
    get:
      tags: [Offers]
      operationId: listOffers
      summary: List offers
      description: >-
        ENT callers get their own offers (any status). All other roles get OPEN offers,
        optionally filtered by gouvernorat.
      x-lambda: offers
      x-roles: []
      parameters:
        - name: gouvernorat
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of offers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Offers]
      operationId: createOffer
      summary: Publish an offer (similar-subject warning returned in `similar`)
      x-lambda: offers
      x-roles: [ENT]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfferCreate'}
      responses:
        '201':
          description: Offer created (status OPEN); `similar` holds a non-blocking warning
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/offers/{id}:
    parameters:
      - $ref: '#/components/parameters/OfferIdPath'
    get:
      tags: [Offers]
      operationId: getOffer
      summary: Get an offer
      x-lambda: offers
      x-roles: []
      responses:
        '200':
          description: Offer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Offers]
      operationId: updateOffer
      summary: Edit an offer or close it (status CLOSED or FILLED)
      x-lambda: offers
      x-roles: [ENT]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfferUpdate'}
      responses:
        '200':
          description: Updated offer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/students/me/recommendations:
    get:
      tags: [Offers]
      operationId: listMyRecommendations
      summary: Top 5 recommended offers for the student
      x-lambda: offers
      x-roles: [ETU]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Recommendations ordered by rank
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  # -------------------------------------------------------- Applications
  /v1/offers/{id}/applications:
    parameters:
      - $ref: '#/components/parameters/OfferIdPath'
    post:
      tags: [Applications]
      operationId: applyToOffer
      summary: Apply to an offer (max 5 active applications per student)
      x-lambda: applications
      x-roles: [ETU]
      responses:
        '201':
          description: Application created with status PENDING
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 6th active application, already applied, or offer not OPEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      tags: [Applications]
      operationId: listOfferApplications
      summary: Applications received for an offer (opening marks PENDING ones as VIEWED)
      x-lambda: applications
      x-roles: [ENT]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of applications
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/students/me/applications:
    get:
      tags: [Applications]
      operationId: listMyApplications
      summary: The student's applications and their status
      x-lambda: applications
      x-roles: [ETU]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of applications
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/applications/{offerId}/{studentId}:
    parameters:
      - {name: offerId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [Applications]
      operationId: updateApplicationStatus
      summary: Apply an action to an application
      description: >-
        ENT: in_progress, accept, reject. ETU: confirm (creates the convention and withdraws
        the other active applications), decline, withdraw. Wrong role for the action is 403;
        invalid transition is 409.
      x-lambda: applications
      x-roles: [ETU, ENT]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationActionRequest'}
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # --------------------------------------------------------- Conventions
  /v1/conventions:
    get:
      tags: [Conventions]
      operationId: listConventions
      summary: List conventions visible to the caller
      description: >-
        ETU: own convention. ENT: conventions of the company. RESP: conventions of the
        institution (pending their signature by default). With withoutSupervisor=true
        (RESP only): approved conventions whose student has no supervisor.
      x-lambda: conventions
      x-roles: [ETU, ENT, RESP]
      parameters:
        - name: withoutSupervisor
          in: query
          schema: {type: boolean}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of conventions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConventionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/conventions/{id}:
    parameters:
      - $ref: '#/components/parameters/ConventionIdPath'
    get:
      tags: [Conventions]
      operationId: getConvention
      summary: Get a convention with its audit trail
      x-lambda: conventions
      x-roles: [ETU, ENT, RESP]
      responses:
        '200':
          description: Convention and events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConventionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Conventions]
      operationId: correctConvention
      summary: Correct the text of a refused convention (state DRAFT)
      x-lambda: conventions
      x-roles: [RESP]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConventionCorrection'}
      responses:
        '200':
          description: Corrected convention (PDF regenerated)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Convention'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/conventions/{id}/sign:
    parameters:
      - $ref: '#/components/parameters/ConventionIdPath'
    post:
      tags: [Conventions]
      operationId: signConvention
      summary: Sign at the caller's step (RESP signature is the final approval)
      x-lambda: conventions
      x-roles: [ETU, ENT, RESP]
      responses:
        '200':
          description: Convention in its next state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Convention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/conventions/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ConventionIdPath'
    post:
      tags: [Conventions]
      operationId: rejectConvention
      summary: Refuse the convention (reason mandatory, returns to DRAFT)
      x-lambda: conventions
      x-roles: [ENT, RESP]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RejectRequest'}
      responses:
        '200':
          description: Convention back in DRAFT, signatures invalidated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Convention'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/conventions/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ConventionIdPath'
    post:
      tags: [Conventions]
      operationId: resubmitConvention
      summary: Resend a corrected convention (DRAFT to SUBMITTED)
      x-lambda: conventions
      x-roles: [RESP]
      responses:
        '200':
          description: Convention in SUBMITTED, signature circuit restarts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Convention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/conventions/{id}/pdf-url:
    parameters:
      - $ref: '#/components/parameters/ConventionIdPath'
    get:
      tags: [Conventions]
      operationId: getConventionPdfUrl
      summary: Presigned download URL (5 minutes); final copy with QR code once APPROVED
      x-lambda: conventions
      x-roles: [ETU, ENT, RESP]
      responses:
        '200':
          description: Presigned URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PdfUrl'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/templates/convention:
    get:
      tags: [Conventions]
      operationId: getConventionTemplate
      summary: Current convention template of the institution
      x-lambda: conventions
      x-roles: [RESP]
      responses:
        '200':
          description: Current template version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConventionTemplate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Conventions]
      operationId: putConventionTemplate
      summary: Save a new template version (text with {{placeholders}})
      x-lambda: conventions
      x-roles: [RESP]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConventionTemplateInput'}
      responses:
        '200':
          description: New template version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConventionTemplate'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/settings/deadline:
    get:
      tags: [Conventions]
      operationId: getDeadlineSettings
      summary: PFE deadline of the institution
      x-lambda: conventions
      x-roles: [RESP]
      responses:
        '200':
          description: Deadline settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeadlineSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Conventions]
      operationId: putDeadlineSettings
      summary: Set, change or disable the PFE deadline
      x-lambda: conventions
      x-roles: [RESP]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeadlineSettings'}
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeadlineSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  # --------------------------------------------------------- Supervision
  /v1/teachers:
    get:
      tags: [Supervision]
      operationId: listTeachers
      summary: Teachers of the caller's institution, filtered by expertise
      x-lambda: supervision
      x-roles: [ETU, RESP]
      parameters:
        - name: expertise
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of teachers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeacherPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/supervision/request:
    post:
      tags: [Supervision]
      operationId: requestSupervision
      summary: Ask a teacher to supervise (after convention APPROVED)
      x-lambda: supervision
      x-roles: [ETU]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupervisionRequest'}
      responses:
        '201':
          description: Request created (REQUESTED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supervision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/supervision/requests:
    get:
      tags: [Supervision]
      operationId: listSupervisionRequests
      summary: Supervision records of the teacher (default status REQUESTED)
      x-lambda: supervision
      x-roles: [ENS]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/SupervisionStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of supervisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupervisionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/supervision/{studentId}/respond:
    parameters:
      - $ref: '#/components/parameters/StudentIdPath'
    post:
      tags: [Supervision]
      operationId: respondToSupervision
      summary: Accept or decline a supervision request
      x-lambda: supervision
      x-roles: [ENS]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupervisionRespondRequest'}
      responses:
        '200':
          description: Updated supervision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supervision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/supervision/{studentId}/assign:
    parameters:
      - $ref: '#/components/parameters/StudentIdPath'
    post:
      tags: [Supervision]
      operationId: assignSupervisor
      summary: Directly assign a teacher to a student (effective immediately)
      x-lambda: supervision
      x-roles: [RESP]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupervisionAssignRequest'}
      responses:
        '200':
          description: Supervision with status ASSIGNED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supervision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ------------------------------------------------------------ Journals
  /v1/journals/{week}:
    parameters:
      - name: week
        in: path
        required: true
        description: ISO week, e.g. 2026-W42
        schema: {type: string, pattern: '^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$'}
    put:
      tags: [Journals]
      operationId: putJournalEntry
      summary: Create or replace the student's entry for a week
      x-lambda: journals
      x-roles: [ETU]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JournalEntryInput'}
      responses:
        '200':
          description: Saved entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalEntry'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/students/{id}/journals:
    parameters:
      - {name: id, in: path, required: true, description: Student id (userId), schema: {type: string, format: uuid}}
    get:
      tags: [Journals]
      operationId: listStudentJournals
      summary: Journal entries of a student
      description: ETU (self only), ENS (supervised students), ENT (own interns).
      x-lambda: journals
      x-roles: [ETU, ENS, ENT]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/journals/{studentId}/{week}/validate:
    parameters:
      - $ref: '#/components/parameters/StudentIdPath'
