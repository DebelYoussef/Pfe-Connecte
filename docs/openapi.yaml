        in: path
        required: true
        schema: {type: string, pattern: '^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$'}
    post:
      tags: [Journals]
      operationId: validateJournalEntry
      summary: Company validates a weekly entry
      x-lambda: journals
      x-roles: [ENT]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JournalValidateRequest'}
      responses:
        '200':
          description: Validated entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalEntry'}
