      - $ref: '#/components/parameters/VersionPath'
    post:
      tags: [Reports]
      operationId: reviewReport
      summary: Company or supervisor decision on a report version
      description: Comment is mandatory for CHANGES_REQUESTED. Report becomes VALIDATED only when both approve.
